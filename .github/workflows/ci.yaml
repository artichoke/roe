---
name: CI
"on":
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  schedule:
    - cron: "0 0 * * WED"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            runner: ubuntu-26.04
          - name: windows-latest
            runner: windows-2025-vs2026
          - name: macos-latest
            runner: macos-26
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features
      - name: Test additional feature configuration 1
        run: cargo test --no-default-features --features alloc

  build-msrv:
    name: Build (MSRV)
    runs-on: ubuntu-26.04
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.76.0 --no-self-update
          rustup default 1.76.0
          rustc -Vv
          cargo -V

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features

  rust-minimal-versions:
    name: Compile with minimum dependency versions
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Install nightly Rust toolchain
        run: rustup toolchain install nightly --no-self-update

      - name: Generate minimal versions lockfile
        run: cargo +nightly generate-lockfile -Z minimal-versions

      - name: Check with minimal versions
        run: cargo check --all-targets --profile=test

  rust:
    name: Lint and format Rust
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy --no-self-update
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-features --all-targets

  ruby:
    name: Check Ruby scripts
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        id: mise
        uses: ./.github/actions/setup-mise
        with:
          github-token: ${{ github.token }}

      - name: Resolve toolchain versions
        id: toolchains
        uses: ./.github/actions/mise-tool-versions
        with:
          executable: ${{ steps.mise.outputs.executable }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ steps.toolchains.outputs.ruby }}

      - name: Check Ruby syntax
        run: |
          for script in scripts/*.rb; do
            ruby -c "$script"
          done

  text:
    name: Lint and format text
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        id: mise
        uses: ./.github/actions/setup-mise
        with:
          github-token: ${{ github.token }}

      - name: Resolve toolchain versions
        id: toolchains
        uses: ./.github/actions/mise-tool-versions
        with:
          executable: ${{ steps.mise.outputs.executable }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchains.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format with Prettier
        run: pnpm run fmt:check
